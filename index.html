<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function add(){
            var num1=parseInt(document.getElementById("num1").value)
            var num2=parseInt(document.getElementById("num2").value)
            var result=num1+num2;
            document.getElementById("result").value=result   
        }
        function mul(){
            var num1=parseInt(document.getElementById("num1").value)
            var num2=parseInt(document.getElementById("num2").value)
            var result=num1*num2;
            document.getElementById("result").value=result   
        }
        function sub(){
            var num1=parseInt(document.getElementById("num1").value)
            var num2=parseInt(document.getElementById("num2").value)
            var result=num1-num2;
            document.getElementById("result").value=result   
        }
        function div(){
            var num1=parseInt(document.getElementById("num1").value)
            var num2=parseInt(document.getElementById("num2").value)
            var result=num1/num2;
            document.getElementById("result").value=result   
        }
        function mod(){
            var num1=parseInt(document.getElementById("num1").value)
            var num2=parseInt(document.getElementById("num2").value)
            var result=num1%num2;
            document.getElementById("result").value=result   
        }
    </script>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            background-color:antiquewhite ;
            height: 400px;
            width: 500px;
            border: 5px solid black;
            border-radius: 10px;
            box-shadow: 8px 8px 5px grey;
           padding: 20px;
           display: flex;
          flex-direction: column;
           align-items: center;
           gap: 15px;
        }
        .field1,.field2,.field3{
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        button{
            background-color: aquamarine;
            border: 2px solid aquamarine;
            border-radius: 5px;
            height: 30px;
            width: 100px;
            color:brown;
            font-weight: bolder;
            font-size: large;
            font-family: 'Times New Roman', Times, serif;
        }
        .field1 label,.field2 label,.field3 label{
            color:chocolate;
            font-size: large;
        }
        .field1 input,.field2 input,.field3 input{
            width: 200px;
            height: 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
   
       <div class="box">
         <div class="field1">
            <label for="">Num1:</label>
        <input type="text" placeholder="Enter num1" id="num1"><br>
         </div>
       <div class="field2">
         <label for="">Num2:</label>
        <input type="text" placeholder="Enter num2" id="num2"><br>
       </div>
        <div class="field3">
            <label for="">Result:</label>
        <input type="text" placeholder="Result" id="result"><br>
        </div>
       <button onclick="add()">Add</button>
       <button onclick="mul()">Multiply</button>
       <button onclick="sub()">Subtract</button>
       <button onclick="div()">Division</button>
       <button onclick="mod()">Modulous</button>
       </div>
   
</body>
</html>
